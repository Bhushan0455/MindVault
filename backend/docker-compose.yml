services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mindvault
      POSTGRES_USER: mindvault
      POSTGRES_PASSWORD: mindvault
    ports: ["5432:5432"]
    volumes: ["mindvault_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindvault -d mindvault"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mindvault:mindvault@db:5432/mindvault
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mindvault_pg:
