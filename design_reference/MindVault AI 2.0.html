<style>
:root{--fd:'Space Grotesk','Plus Jakarta Sans',Inter,system-ui,sans-serif;--bg:#080B14;--side:#0D1220;--card:#121A2B;--s2:#182238;--ac:#7867F7;--ac2:#36B9D8;--tx:#F4F6FC;--mu:#98A3B8;--ok:#38B879;--wn:#E6AD52;--er:#E36B78;--bd:rgba(152,163,184,.16);--sw:236px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.6 'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.003em}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{margin:0;font:600 20px/1.25 var(--fd);letter-spacing:-.02em}
h3{margin:0;font-size:15px;line-height:1.4;font-weight:600;letter-spacing:-.005em}
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100%;transition:grid-template-columns .25s}
.app.col{--sw:68px}
aside{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--ac2);font-weight:600;margin-left:3px}
.col .lbl{display:none}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--mu);cursor:pointer;border:0;background:none;width:100%;text-align:left;position:relative;white-space:nowrap;transition:background .15s,color .15s}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,rgba(120,103,247,.28),rgba(120,103,247,.06));color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
.col .nav:hover::after{content:attr(data-t);position:fixed;left:72px;background:var(--s2);border:1px solid var(--bd);padding:4px 10px;border-radius:6px;font-size:12px;z-index:60;color:var(--tx)}
.sep{height:1px;background:var(--bd);margin:12px 6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--bd);background:rgba(8,11,20,.85);backdrop-filter:blur(8px)}
.crumb{color:var(--mu);font-size:12px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;width:230px;max-width:30vw}
.search input{background:none;border:0;outline:0;width:100%}
.ib{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center;position:relative}
.ib:hover{background:var(--s2);color:var(--tx)}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:0;text-align:left}
.who small{display:block;color:var(--mu);font-size:11px;line-height:1.2}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--bd);border-radius:12px;min-width:230px;padding:6px;z-index:70;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:pi .15s}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
.pop button:hover{background:var(--s2)}
.rel{position:relative}
.page{padding:22px;overflow:auto;flex:1;min-height:0;animation:pi .28s ease-out}
@keyframes pi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--mu);max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;transition:transform .25s,box-shadow .25s,border-color .25s}
.tilt:hover{transform:perspective(800px) rotateX(2.5deg) translateY(-3px);box-shadow:0 18px 34px rgba(0,0,0,.45),0 0 0 1px rgba(120,103,247,.3)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.met{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:12px}
.btn{background:var(--ac);border:0;color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
.btn.ok{background:rgba(56,184,121,.18);color:var(--ok);border:1px solid rgba(56,184,121,.4)}
.btn.no{background:rgba(227,107,120,.15);color:var(--er);border:1px solid rgba(227,107,120,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid}
.approved{color:var(--ok);border-color:rgba(56,184,121,.4);background:rgba(56,184,121,.1)}
.pending{color:var(--wn);border-color:rgba(230,173,82,.45);background:rgba(230,173,82,.1)}
.rejected{color:var(--er);border-color:rgba(227,107,120,.4);background:rgba(227,107,120,.1)}
.info{color:var(--ac2);border-color:rgba(54,185,216,.4);background:rgba(54,185,216,.1)}
.sim{color:#fff;border-color:var(--wn);background:rgba(230,173,82,.25);letter-spacing:.04em}
.ban{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:16px;border:1px dashed rgba(230,173,82,.5);background:rgba(230,173,82,.07);color:#f1d6a4;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:600;letter-spacing:.01em;font-size:12px;background:var(--s2);cursor:pointer;white-space:nowrap}
tr.pend td{background:repeating-linear-gradient(135deg,rgba(230,173,82,.05) 0 8px,transparent 8px 16px)}
tr.rej td{opacity:.6}
tr.hv:hover td{background:rgba(120,103,247,.07);cursor:pointer}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;outline:0;width:100%}

textarea{min-height:84px;resize:vertical}
.ov{position:fixed;inset:0;background:rgba(4,6,12,.72);display:grid;place-items:center;z-index:80;padding:16px;animation:pi .18s}
.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:680px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--tx);border-color:var(--ac)}
.drop{border:1.5px dashed rgba(152,163,184,.4);border-radius:16px;padding:38px 20px;text-align:center;background:var(--s2);transition:.2s;cursor:pointer}
.drop.over{border-color:var(--ac2);background:rgba(54,185,216,.08);box-shadow:0 0 0 3px rgba(54,185,216,.15),inset 0 0 40px rgba(120,103,247,.12)}
.bar{height:8px;border-radius:5px;background:var(--s2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.ex{background:var(--bg);border-left:3px solid var(--ac);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#c9d1e3}
.st{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.sd{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:11px}
.sd.d{background:var(--ok);border-color:var(--ok);color:#06140d}.sd.x{border-color:var(--wn);color:var(--wn)}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);padding:11px 15px;border-radius:10px;z-index:99;max-width:360px;animation:pi .2s;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--wn)}.toast.err{border-left-color:var(--er)}
.auth{min-height:100vh;min-height:100dvh;width:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 20% 0%,rgba(120,103,247,.2),transparent),radial-gradient(700px 500px at 90% 100%,rgba(54,185,216,.14),transparent),var(--bg)}
.auth .card{width:100%;max-width:420px;padding:26px;margin:auto}
.pw{position:relative;width:100%}.pw input{padding-right:44px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--mu);cursor:pointer;padding:0}
.eye:hover{background:var(--s2);color:var(--tx)}.eye:focus-visible{outline:0;box-shadow:0 0 0 2px rgba(120,103,247,.5);color:var(--tx)}
.err{color:var(--er);font-size:12px}
.del{color:var(--er);text-decoration:line-through}.add{color:var(--ok)}
.mbtn{display:none}
.scrim{display:none}
.nav{font-size:13.5px;font-weight:500}
.btn{font-size:13px;font-weight:600}
.tab,.who{font-weight:500}.who small{font-weight:400}
.f>span{font-weight:500;letter-spacing:.005em}
.bd{letter-spacing:.01em}
.toast{font-size:13px;font-weight:500}
.sm{line-height:1.5;font-weight:400}.mu{font-weight:400}
.pt{font-size:19px}
@media(max-width:820px){.pt{font-size:16px}.met{font-size:26px}h3{font-size:14px}}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:90;left:0;top:0;bottom:0;width:250px;transform:translateX(-102%);transition:transform .25s}.app.open aside{transform:none}.app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:85}.mbtn{display:grid}.search{display:none}.who span{display:none}.page{padding:14px}.app.col aside .lbl{display:inline}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Item detail / edit modal ---------- */
function ItemModal({it,c,close}){
  const [ed,setEd]=useState(false);const [d,setD]=useState(it);
  const set=(k,v)=>setD(x=>({...x,[k]:v}));
  const save=()=>{if(!d.text.trim())return c.notify('Rule or fact text cannot be empty.','err');
    const wasApproved=it.status==='approved';
    c.upd(it.id,{...d,status:wasApproved?'pending':d.status,ver:it.ver+(wasApproved?1:0),upd:TODAY});
    c.notify(wasApproved?'Edit creates version '+(it.ver+1)+' as Pending until re-approved (local demo, not saved to backend).':'Edit applied locally (demo, not saved to backend).');setEd(false)};
  return html`<${Modal} close=${close}>
    <div className="row" style=${{justifyContent:'space-between'}}><div className="row"><${Bd} s=${it.status}/><span className="bd info">${it.type==='rule'?'Rule':'Fact'}</span><span className="mu sm">v${it.ver}</span></div><button className="ib" onClick=${close} aria-label="Close"><${Icon} n="x"/></button></div>
    ${ed?html`<div className="grid" style=${{marginTop:12}}>
      <${F} l="Rule / fact text"><textarea value=${d.text} onChange=${e=>set('text',e.target.value)}/></${F}>
      <div className="grid g4"><${F} l="Category"><${Sel} v=${d.cat} o=${CATS} on=${v=>set('cat',v)}/></${F}><${F} l="Priority"><${Sel} v=${d.priority} o=${Object.keys(PR)} on=${v=>set('priority',v)}/></${F}>
      ${Object.keys(SC).map(k=>html`<${F} key=${k} l=${k==='ctype'?'Content type':k[0].toUpperCase()+k.slice(1)}><${Sel} v=${d[k]} o=${SC[k]} on=${v=>set(k,v)}/></${F}>`)}</div>
      <div className="row"><button className="btn" onClick=${save}>Save changes</button><button className="btn g" onClick=${()=>{setD(it);setEd(false)}}>Cancel</button></div></div>`
    :html`<h3 style=${{margin:'12px 0 10px',lineHeight:1.4}}>${it.text}</h3>
      <div className="grid g4" style=${{marginBottom:12}}>${[['Category',it.cat],['Priority',it.priority],['Brand','Veyra'],['Channel',it.channel],['Audience',it.audience],['Region',it.region],['Content type',it.ctype],['Campaign',it.campaign]].map(([a,b])=>html`<div key=${a}><div className="mu sm">${a}</div>${b}</div>`)}</div>
      <div className="mu sm" style=${{marginBottom:4}}>Original source excerpt · ${it.doc} · ${it.ref}</div><div className="ex">${it.ex}</div>
      ${it.by&&html`<p className="mu sm">Approved by ${it.by} · ${it.upd} · version ${it.ver} (local demo record)</p>`}

        <button className="btn g" onClick=${()=>setEd(true)}>Edit</button></div>`}
  </${Modal}>`;
}

/* ---------- Upload ---------- */
function Upload({c}){
  const [file,setFile]=useState(null),[err,setErr]=useState(''),[over,setOver]=useState(false),[prev,setPrev]=useState(''),[tried,setTried]=useState(false);
  const [m,setM]=useState({name:'',brand:'Veyra',type:'Brand guidelines',desc:''});const ref=useRef();
  const pick=f=>{setErr('');setPrev('');setTried(false);if(!f)return;const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='xlsx')return setErr('XLSX is not supported by the extraction backend yet. Upload a PDF, DOCX or TXT file.');
    if(!['pdf','docx','txt'].includes(ext))return setErr('Unsupported file type “.'+ext+'”. Upload a PDF, DOCX or TXT file.');
    if(f.size>5*1024*1024)return setErr('File is '+(f.size/1048576).toFixed(1)+' MB. The limit is 5 MB.');
    if(f.size===0)return setErr('This file is empty. Choose a document that contains text.');
    setFile(f);setM(x=>({...x,name:x.name||f.name.replace(/\.[^.]+$/,'')}));
    if(ext==='txt'){const r=new FileReader();r.onload=()=>setPrev(String(r.result).slice(0,1500));r.readAsText(f)}};
  const sz=b=>b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB';
  const stages=[['File selected and validated locally',file?'d':''],['Upload to backend (POST /documents)',tried?'x':''],['Text extraction (POST /documents/{id}/extract)',''],['Extraction completed or failed','']];
  return html`<div className="grid g2" style=${{alignItems:'start'}}>
    <div className="grid">
      <div className=${'drop'+(over?' over':'')} onClick=${()=>ref.current.click()} onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);pick(e.dataTransfer.files[0])}}>
        <div style=${{color:'var(--ac2)'}}><${Icon} n="up" s=${34}/></div><h3 style=${{margin:'8px 0 4px'}}>Drop a brand document here</h3><div className="mu">or click to browse · PDF, DOCX or TXT · up to 5 MB</div>
        <input ref=${ref} type="file" accept=".pdf,.docx,.txt" hidden onChange=${e=>{pick(e.target.files[0]);e.target.value=''}}/></div>
      ${err&&html`<div className="ban" style=${{borderColor:'var(--er)',color:'#f3b3ba',background:'rgba(227,107,120,.08)',margin:0}}>${err}</div>`}
      ${file&&html`<div className="card"><div className="row" style=${{justifyContent:'space-between'}}><div><b>${file.name}</b><div className="mu sm">${file.name.split('.').pop().toUpperCase()} · ${sz(file.size)}</div></div><div className="row"><button className="btn g" onClick=${()=>ref.current.click()}>Replace</button><button className="btn no" onClick=${()=>{setFile(null);setPrev('');setTried(false)}}>Remove</button></div></div></div>`}
      <div className="card grid"><h3>Document details</h3>
        <${F} l="Document name"><input value=${m.name} onChange=${e=>setM({...m,name:e.target.value})}/></${F}>
        <div className="grid g2"><${F} l="Brand"><${Sel} v=${m.brand} o=${['Veyra']} on=${v=>setM({...m,brand:v})}/></${F}><${F} l="Document type"><${Sel} v=${m.type} o=${['Brand guidelines','Price list','Campaign playbook','Product specification']} on=${v=>setM({...m,type:v})}/></${F}></div>
        <${F} l="Description (optional)"><textarea value=${m.desc} onChange=${e=>setM({...m,desc:e.target.value})}/></${F}>
        <button className="btn" disabled=${!file||!m.name.trim()} onClick=${()=>{setTried(true);c.notify('Upload not sent: the MindVault backend is not connected in this preview.','warn')}}>Upload and extract</button>
        ${!file&&html`<span className="mu sm">Choose a file and name it to enable upload.</span>`}</div></div>
    <div className="grid">
      <div className="card"><h3>Extraction progress</h3><p className="mu sm">Stages complete only when the backend confirms them. None are simulated.</p>
        ${stages.map(([s,st],i)=>html`<div key=${i} className="st"><span className=${'sd '+st}>${st==='d'?'✓':st==='x'?'!':''}</span><div>${s}${st==='x'&&html`<div className="sm" style=${{color:'var(--wn)'}}>Unavailable: no backend connected. Nothing was uploaded or saved.</div>`}</div></div>`)}</div>
      <div className="card"><h3>Extracted text preview</h3>${prev?html`<div className="ban" style=${{margin:'10px 0'}}>Local TXT preview only. It was not extracted by the backend and has no page references.</div><pre className="ex" style=${{whiteSpace:'pre-wrap',maxHeight:220,overflow:'auto'}}>${prev}</pre>`:html`<p className="mu">${file?'PDF and DOCX text is extracted by the backend (PyMuPDF / python-docx). PDFs get page numbers; DOCX gets section and paragraph references. Scanned PDFs return a limitation notice with a manual-entry option (no OCR in v1).':'Select a document to see its preview here.'}</p>`}</div>
      <div className="card"><h3>Documents</h3><${Demo} t="Demo documents."/>${DOCS0.map(d=>html`<div key=${d.id} style=${{padding:'8px 0',borderBottom:'1px solid var(--bd)'}}><b>${d.n}</b><div className="mu sm">${d.t} · ${d.d} · ${d.id}</div><span className=${'bd '+(d.s.startsWith('Failed')?'rejected':d.s==='Extracted'?'approved':'pending')}>${d.s}</span></div>`)}</div></div></div>`;
}

    ${tab==='ctx'&&html`<div><${Demo} t="DEMO FIXTURE shaped like the backend’s applied/skipped response. Rule selection runs on the server, never in this frontend."/>
      <div className="row" style=${{marginBottom:12}}><button className=${'btn '+(cx==='ig'?'':'g')} onClick=${()=>setCx('ig')}>Instagram post</button><button className=${'btn '+(cx==='inv'?'':'g')} onClick=${()=>setCx('inv')}>Investor deck</button></div>
      <p className="mu">Context: ${cur.t}</p><div className="grid g2"><div className="card"><h3><span className="bd approved">Applied</span></h3>${cur.ap.map(([a,b])=>html`<div key=${a} style=${{padding:'8px 0',borderBottom:'1px solid var(--bd)'}}>${a}<div className="mu sm">${b}</div></div>`)}</div><div className="card"><h3><span className="bd pending">Skipped</span></h3>${cur.sk.map(([a,b])=>html`<div key=${a} style=${{padding:'8px 0',borderBottom:'1px solid var(--bd)'}}>${a}<div className="mu sm">${b}</div></div>`)}</div></div>
      <div className="ban" style=${{marginTop:14}}>If a context field is missing or two rules conflict, the backend flags it as needing human review instead of guessing.</div></div>`}</div>`;
}

/* ---------- Clarity Auditor ---------- */
function Clarity({c}){
  const [items,setItems]=useState(CL0),[view,setView]=useState({});
  const up=(id,p)=>setItems(a=>a.map(x=>x.id===id?{...x,...p}:x));
  return html`<div className="grid"><${Demo} t="AI-proposed rewrites are demo fixtures. Accepted rewrites will be saved as new rule versions through the backend."/>
  ${items.map(x=>html`<div key=${x.id} className="card"><div className="row" style=${{justifyContent:'space-between'}}><span className="bd info">${x.cat}</span><${Bd} s=${x.st==='accepted'?'approved':x.st}/></div>
    <div className="mu sm" style=${{marginTop:10}}>Original guideline · ${x.doc} · ${x.ref} · v${x.v}</div><div className="ex">${x.orig}</div>
    <div className="mu sm" style=${{marginTop:10}}>Problem</div><div>${x.why}</div>
    <div className="row" style=${{marginTop:10}}><span className="mu sm">AI proposal (not yet a rule)</span><button className="btn g" style=${{padding:'3px 10px'}} onClick=${()=>setView({...view,[x.id]:!view[x.id]})}>${view[x.id]?'Show proposal':'Compare versions'}</button></div>
    ${view[x.id]?html`<div className="grid g2" style=${{marginTop:6}}><div><div className="mu sm">Previous version (v${x.v})</div><div className="ex">${x.orig}</div></div><div><div className="mu sm">Revised version (v${x.v+1}) ${x.st==='accepted'?'· admin approved':'· proposed'}</div><div className="ex" style=${{borderColor:'var(--ok)'}}>${x.rw}</div></div></div>`:html`<textarea style=${{marginTop:6}} value=${x.rw} disabled=${x.st!=='pending'} onChange=${e=>up(x.id,{rw:e.target.value})}/>`}
    ${x.st==='pending'&&html`<div className="row" style=${{marginTop:10}}><button className="btn ok" onClick=${()=>{if(!c.isAdmin)return c.notify('Only an Administrator can approve a rewrite.','warn');up(x.id,{st:'accepted'});c.notify('Approved locally as version '+(x.v+1)+' (demo, not saved to backend).')}}>Approve rewrite</button><button className="btn no" onClick=${()=>c.confirm('Reject this proposal? The original guideline stays unchanged.',()=>up(x.id,{st:'rejected'}))}>Reject</button></div>`}</div>`)}</div>`;
}

/* ---------- Source Updates ---------- */
function Sources({c}){
  const [u,setU]=useState(UP0),[vw,setVw]=useState(null),[hist,setHist]=useState([]);
  const set=(id,st)=>setU(a=>a.map(x=>x.id===id?{...x,st}:x));
  return html`<div className="grid"><div className="ban"><${Sim}/><span>Source updates are simulated. No real Drive or external connection exists. Approval creates a new knowledge version and keeps the old one.</span></div>
  ${u.map(x=>{const diff=x.nums[1]-x.nums[0];return html`<div key=${x.id} className="card"><div className="row" style=${{justifyContent:'space-between'}}><div><b>${x.item}</b> <${Sim}/><div className="mu sm">${x.src} · proposed ${x.date}</div></div><${Bd} s=${x.st==='accepted'?'approved':x.st}/></div>
    <div className="grid g4" style=${{margin:'12px 0'}}><div><div className="mu sm">Original value</div><div className="met del" style=${{fontSize:22}}>${x.from}</div></div><div><div className="mu sm">Proposed value</div><div className="met add" style=${{fontSize:22}}>${x.to}</div></div><div><div className="mu sm">Difference</div><div className="met" style=${{fontSize:22}}>${diff>0?'+':''}${diff}${x.from.startsWith('₹')?' ₹':' h'}</div></div></div>
    ${vw===x.id&&html`<div className="ex" style=${{marginBottom:10}}>v1 (active): ${x.item} = ${x.from}<br/>v2 (proposed): ${x.item} = ${x.to}<br/><span className="mu">Approving keeps v1 in history as superseded.</span></div>`}
    <div className="row"><button className="btn g" onClick=${()=>setVw(vw===x.id?null:x.id)}>View changes</button>
    ${x.st==='pending'&&html`<button className="btn ok" onClick=${()=>{if(!c.isAdmin)return c.notify('Only an Administrator can approve updates.','warn');set(x.id,'accepted');setHist(h=>[...h,x.item+': v1 '+x.from+' superseded by v2 '+x.to]);c.notify('Simulation: version 2 created locally; version 1 retained.')}}>Approve update</button><button className="btn no" onClick=${()=>c.confirm('Reject this simulated update?',()=>set(x.id,'rejected'))}>Reject</button>`}</div></div>`})}
  ${hist.length>0&&html`<div className="card"><h3>Version history (simulation)</h3>${hist.map(h=>html`<div key=${h} className="mu" style=${{padding:'5px 0'}}>${h}</div>`)}</div>`}</div>`;
}

/* ---------- Evaluation ---------- */
function Evaluation({c}){
  const [notes,setNotes]=useState({}),[log,setLog]=useState([]),[fb,setFb]=useState({t:'T01',k:'Incorrect warning (false positive)',n:''});
  return html`<div className="grid"><${Demo} t="Test cases are fictional. Actual results will come from the backend review run (POST /content/{id}/review). No accuracy figures are shown."/>
  <div className="tw"><table style=${{minWidth:900}}><thead><tr><th>ID</th><th>Test</th><th>Sample draft</th><th>Expected</th><th>Actual (backend)</th><th>Result</th><th>Reviewer notes</th></tr></thead><tbody>
  ${EV0.map(t=>html`<tr key=${t.id}><td>${t.id}</td><td>${t.d}</td><td style=${{minWidth:200}}>${t.draft}</td><td style=${{minWidth:170}}>${t.exp}</td><td className="mu">Not run: backend not connected<div className="sm">Detected violations and evidence references appear here.</div></td><td><span className="bd">Not evaluated</span></td><td><input value=${notes[t.id]||''} onChange=${e=>setNotes({...notes,[t.id]:e.target.value})} placeholder="Add a note"/></td></tr>`)}</tbody></table></div>
  <div className="card grid" style=${{maxWidth:680}}><h3>Record an AI checker problem</h3><div className="grid g2"><${F} l="Test"><${Sel} v=${fb.t} o=${EV0.map(x=>x.id)} on=${v=>setFb({...fb,t:v})}/></${F}><${F} l="Problem type"><${Sel} v=${fb.k} o=${['Incorrect warning (false positive)','Missed issue (false negative)','Incorrect source reference','AI output error']} on=${v=>setFb({...fb,k:v})}/></${F}></div>
  <${F} l="What happened?"><textarea value=${fb.n} onChange=${e=>setFb({...fb,n:e.target.value})}/></${F}>
  <div><button className="btn" onClick=${()=>{if(!fb.n.trim())return c.notify('Describe what happened first.','err');setLog([{...fb,id:Date.now()},...log]);setFb({...fb,n:''});c.notify('Recorded in this session only (demo, not saved to backend).')}}>Record problem</button></div>
  ${log.map(l=>html`<div key=${l.id} style=${{padding:'8px 0',borderTop:'1px solid var(--bd)'}}><span className="bd rejected">${l.k}</span> <b>${l.t}</b><div className="mu">${l.n}</div></div>`)}</div></div>`;
}

/* ---------- Profile & Settings ---------- */
function Profile({c}){
  const [e,setE]=useState(false),[d,setD]=useState(c.user);
  return html`<div className="card grid" style=${{maxWidth:560}}><div className="row"><div className="av" style=${{width:64,height:64,fontSize:22}}>${initials(c.user.name)}</div><div><h3>${c.user.name}</h3><span className="bd info">${c.user.role}</span></div></div>
  ${e?['name','email','org'].map(k=>html`<${F} key=${k} l=${{name:'Full name',email:'Email',org:'Organisation'}[k]}><input value=${d[k]} onChange=${ev=>setD({...d,[k]:ev.target.value})}/></${F}>`):[['Email',c.user.email],['Organisation',c.user.org],['Role',c.user.role],['Account created','Not available in demo mode']].map(([a,b])=>html`<div key=${a}><div className="mu sm">${a}</div>${b}</div>`)}
  <div className="row">${e?html`<button className="btn" onClick=${()=>{c.setUser(d);setE(false);c.notify('Profile updated locally (demo, not saved to backend).')}}>Save profile</button>`:html`<button className="btn g" onClick=${()=>setE(true)}>Edit profile</button>`}<button className="btn g" disabled title="No password-change endpoint has been confirmed by the backend team">Change password (unavailable)</button><button className="btn no" onClick=${c.logout}>Log out</button></div></div>`;
}
function Settings({c}){
  return html`<div className="grid" style=${{maxWidth:640}}><div className="card grid"><h3>API connection</h3><${F} l="VITE_API_BASE_URL"><input disabled value=${API_BASE||'(not set: running in demo mode)'}/></${F}><p className="mu sm">In your React project, set this env variable to the FastAPI URL and route all calls through one API service sending <code>Authorization: Bearer</code>. Keep Gemini keys on the server only.</p></div>
  <div className="card grid"><h3>Interface</h3><label className="row"><input type="checkbox" style=${{width:'auto'}} checked=${c.col} onChange=${()=>c.setCol(!c.col)}/> Collapse sidebar</label></div>
  <div className="card"><h3>Backend integration still needed</h3><ul className="mu" style=${{paddingLeft:18,margin:'8px 0'}}><li>POST /auth/demo, GET /me</li><li>POST /documents, POST /documents/{id}/extract</li><li>GET /extraction-jobs/{id} (to confirm)</li><li>GET /rules, GET /facts, approve and reject actions</li><li>Clarity proposals and source-update proposals</li></ul></div></div>`;
}

/* ---------- Auth ---------- */
function Auth({mode,c}){
  const [f,setF]=useState({name:'',email:'',pw:'',pw2:'',org:'',terms:false}),[show,setShow]=useState(false),[er,setEr]=useState({}),[msg,setMsg]=useState('');
  const set=(k,v)=>setF(x=>({...x,[k]:v}));const su=mode==='signup';
  const go=ev=>{ev.preventDefault();const e={};
    if(su&&!f.name.trim())e.name='Enter your full name.';
    if(!/^\S+@\S+\.\S+$/.test(f.email))e.email='Enter a valid work email.';
    if(su?!/(?=.*\d)(?=.*[A-Za-z]).{8,}/.test(f.pw):!f.pw)e.pw=su?'Use 8+ characters with letters and numbers.':'Enter your password.';
    if(su&&f.pw!==f.pw2)e.pw2='Passwords do not match.';if(su&&!f.org.trim())e.org='Enter your organisation.';if(su&&!f.terms)e.terms='Accept the terms to continue.';
    setEr(e);if(Object.keys(e).length)return;
    setMsg(su?'Signup is pending integration: the backend has no registration endpoint yet, so no account was created.':'The authentication backend is not reachable from this preview, so you were not signed in. Use a demo identity below.')};
  const E=k=>er[k]&&html`<span className="err">${er[k]}</span>`;
  return html`<div className="auth"><div className="card" style=${{animation:'pi .4s'}}><div style=${{display:'flex',justifyContent:'center',marginBottom:6}}><${Wordmark}/></div><p className="mu" style=${{textAlign:'center',marginTop:0}}>${su?'Create your organisation’s vault':'Sign in to govern your brand knowledge'}</p>
  <form onSubmit=${go} className="grid" noValidate>
    ${su&&html`<${F} l="Full name"><input value=${f.name} onChange=${e=>set('name',e.target.value)}/>${E('name')}</${F}>`}
    <${F} l=${su?'Work email':'Email'}><input type="email" value=${f.email} onChange=${e=>set('email',e.target.value)}/>${E('email')}</${F}>
    <${F} l="Password"><div className="pw"><input type=${show?'text':'password'} value=${f.pw} autoComplete=${su?'new-password':'current-password'} onChange=${e=>set('pw',e.target.value)}/><button type="button" className="eye" aria-label=${show?'Hide password':'Show password'} aria-pressed=${show} title=${show?'Hide password':'Show password'} onClick=${()=>setShow(!show)}><${Icon} n=${show?'eyeoff':'eye'} s=${18}/></button></div>${E('pw')}</${F}>
    ${su&&html`<${F} l="Confirm password"><input type="password" value=${f.pw2} onChange=${e=>set('pw2',e.target.value)}/>${E('pw2')}</${F}><${F} l="Organisation name"><input value=${f.org} onChange=${e=>set('org',e.target.value)}/>${E('org')}</${F}><label className="row sm"><input type="checkbox" style=${{width:'auto'}} checked=${f.terms} onChange=${e=>set('terms',e.target.checked)}/> I accept the terms and privacy notice</label>${E('terms')}`}
    ${!su&&html`<div className="row sm" style=${{justifyContent:'space-between'}}><label className="row"><input type="checkbox" style=${{width:'auto'}}/> Remember me</label><a href="#login" onClick=${e=>{e.preventDefault();c.notify('Password reset is not available yet. Ask your administrator.','warn')}}>Forgot password?</a></div>`}
    ${msg&&html`<div className="ban" style=${{margin:0}}>${msg}</div>`}
    <button className="btn" type="submit">${su?'Create account':'Log in'}</button></form>
  <p className="sm mu" style=${{textAlign:'center'}}>${su?'Have an account? ':'New here? '}<a href=${su?'#login':'#signup'}>${su?'Log in':'Create an account'}</a></p>
  <div className="sep"/><div className="mu sm" style=${{marginBottom:8}}>Demo mode (local identity, not a real session)</div><div className="row">${['Administrator','Creator','Reviewer'].map(r=>html`<button key=${r} className="btn g" onClick=${()=>c.login(r)}>${r}</button>`)}</div></div></div>`;
}

/* ---------- App shell ---------- */
function App(){
  const rt=()=>location.hash.slice(1)||'dashboard';
  const [route,setRoute]=useState(rt()),[user,setUser]=useState(null),[kb,setKb]=useState(KB0),[col,setCol]=useState(false),[open,setOpen]=useState(false),[pop,setPop]=useState(null),[toast,setToast]=useState(null),[item,setItem]=useState(null),[cf,setCf]=useState(null),[q,setQ]=useState(undefined);
  useEffect(()=>{const h=()=>{setRoute(rt());setOpen(false);setPop(null)};addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h)},[]);
  const tm=useRef();
  const notify=(m,k)=>{setToast({m,k});clearTimeout(tm.current);tm.current=setTimeout(()=>setToast(null),3800)};
  const go=r=>{location.hash=r};
  const isAdmin=user&&user.role==='Administrator';
  const upd=(id,p)=>setKb(k=>k.map(x=>x.id===id?{...x,...p}:x));
  const approve=x=>{if(!isAdmin)return notify('Only an Administrator can approve knowledge. The backend enforces this as well.','warn');upd(x.id,{status:'approved',by:user.name,upd:TODAY});notify('Approved locally with your name, date and version (demo, not saved to backend).')};
  const reject=x=>{if(!isAdmin)return notify('Only an Administrator can reject knowledge.','warn');upd(x.id,{status:'rejected',upd:TODAY});notify('Rejected locally (demo, not saved to backend).')};
  const login=r=>{setUser({name:{Administrator:'Aarav Mehta',Creator:'Diya Shah',Reviewer:'Kabir Rao'}[r],email:r.toLowerCase()+'@veyra.example',org:'Veyra Audio (demo)',role:r});go('dashboard')};
  const logout=()=>{setUser(null);go('login')};
  const c={kb,setKb,upd,approve,reject,notify,go,isAdmin,user,setUser,logout,login,col,setCol,q,open:id=>setItem(id),confirm:(m,fn)=>setCf({m,fn})};
  if(!user)return html`<div><${Auth} mode=${route==='signup'?'signup':'login'} c=${c}/>${toast&&html`<div className=${'toast '+(toast.k||'')}>${toast.m}</div>`}</div>`;
  const cur=route in TITLES?route:'dashboard';
  const Pg={dashboard:Dashboard,library:Library,upload:Upload,extraction:Extraction,rules:Rules,clarity:Clarity,sources:Sources,evaluation:Evaluation,profile:Profile,settings:Settings}[cur];
  const it=item&&kb.find(x=>x.id===item);
  const Nv=([r,l,i])=>html`<button key=${r} className=${'nav'+(cur===r?' on':'')} data-t=${l} onClick=${()=>go(r)}><${Icon} n=${i}/><span className="lbl">${l}</span></button>`;
  return html`<div className=${'app'+(col?' col':'')+(open?' open':'')}>
    <aside><${Wordmark}/>${NAV.map(Nv)}<div className="sep"/>${ACC.map(Nv)}<button className="nav" data-t="Logout" onClick=${logout}><${Icon} n="out"/><span className="lbl">Logout</span></button>
      <button className="nav" style=${{marginTop:'auto'}} data-t="Collapse" onClick=${()=>setCol(!col)}><span style=${{display:'inline-block',transform:col?'rotate(180deg)':'none',transition:'.25s'}}><${Icon} n="chev"/></span><span className="lbl">Collapse</span></button></aside>
    <div className="scrim" onClick=${()=>setOpen(false)}/>
    <main><div className="top"><button className="ib mbtn" onClick=${()=>setOpen(true)} aria-label="Open menu"><${Icon} n="menu"/></button><div><div className="crumb">MindVault AI / ${TITLES[cur]}</div><h2 className="pt">${TITLES[cur]}</h2></div>
      <div className="search"><${Icon} n="find" s=${15}/><input placeholder="Search knowledge…" onKeyDown=${e=>{if(e.key==='Enter'){setQ(e.target.value);go('library')}}}/></div>
      <div className="rel"><button className="ib" aria-label="Notifications" onClick=${()=>setPop(pop==='n'?null:'n')}><${Icon} n="bell"/><span className="dot"/></button>${pop==='n'&&html`<div className="pop"><button onClick=${()=>go('library')}>${kb.filter(x=>x.status==='pending').length} knowledge items await approval</button><button onClick=${()=>go('sources')}>2 simulated source updates to review</button></div>`}</div>
      <div className="rel"><button className="who" onClick=${()=>setPop(pop==='u'?null:'u')}><div className="av">${initials(user.name)}</div><span>${user.name}<small>${user.role}</small></span></button>${pop==='u'&&html`<div className="pop"><button onClick=${()=>go('profile')}>Profile</button><button onClick=${()=>go('settings')}>Settings</button><button onClick=${logout}>Log out</button></div>`}</div></div>
      <div className="page" key=${cur}>${user.role!=='Administrator'&&html`<div className="ban">You are in the ${user.role} demo role. Knowledge approval needs the Administrator role. Creator and Reviewer screens are built separately and connect to the same backend.</div>`}<${Pg} c=${c}/></div></main>
    ${it&&html`<${ItemModal} key=${it.id+it.ver} it=${it} c=${c} close=${()=>setItem(null)}/>`}
    ${cf&&html`<${Modal} close=${()=>setCf(null)}><h3>Please confirm</h3><p className="mu">${cf.m}</p><div className="row"><button className="btn no" onClick=${()=>{cf.fn();setCf(null)}}>Confirm</button><button className="btn g" onClick=${()=>setCf(null)}>Cancel</button></div></${Modal}>`}
    ${toast&&html`<div className=${'toast '+(toast.k||'')} role="status">${toast.m}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
